[package]
name = "app"
version = "0.1.4"
description = "Hydrate — ricordati di bere: promemoria che si regolano sulle tue abitudini"
authors = ["Andrea Mastracchio"]
license = "MIT"
repository = "https://github.com/AndreaMastracchio/hydrate"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
log = "0.4"
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.15"
